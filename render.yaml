# Render Blueprint — Matchly FC 27
# Dashboard Render : New + → Blueprint → sélectionner ce dépôt (branche main).
# Render détecte ce fichier à la racine et crée le service automatiquement.
services:
  - type: web
    name: matchly-fc-27
    runtime: node
    rootDir: matchly-fc
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
