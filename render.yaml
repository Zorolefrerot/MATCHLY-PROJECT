services:
  - type: web
    name: shopflow-site
    runtime: static
    branch: arena/0b9f89cc-matchly-project
    buildCommand: npm --prefix shopflow ci && npm run build:hosted
    staticPublishPath: ./dist
    headers:
      - path: /app/sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment; filename="ShopFlow-Android.apk"
