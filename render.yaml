services:
  - type: web
    name: shopflow-site
    runtime: node
    branch: arena/0b9f89cc-matchly-project
    plan: free
    buildCommand: npm --prefix shopflow ci && npm run build:hosted
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
