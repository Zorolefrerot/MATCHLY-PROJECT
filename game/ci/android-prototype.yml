name: Android - Prototype IDREM ZENKAI

on:
  push:
    branches: [arena/01a08158-matchly-project]
    paths:
      - game/**
      - .github/workflows/android-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.ref == 'refs/heads/arena/01a08158-matchly-project'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GODOT_BIN: ${{ github.workspace }}/../godot/Godot_v4.5.1-stable_linux.x86_64
      GODOT_TOOLS_DIR: ${{ github.workspace }}/../godot
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install official Godot editor and Android templates
        run: bash game/tools/install_engine.sh --android
      - name: Validate scripts and gameplay
        run: bash game/tools/check.sh
      - name: Configure Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - name: Export and verify debug APK
        run: bash game/tools/export_android.sh
      - name: Prepare software-rendered desktop capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1
      - name: Desktop render evidence (not a device test)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p game/artifacts/screenshots
          export IDREM_CAPTURE_DIR="$GITHUB_WORKSPACE/game/artifacts/screenshots"
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/capture.gd 2>&1 | tee "$RUNNER_TEMP/idrem-check/capture.log"
          ! grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/idrem-check/capture.log"
          grep -q IDREM_CAPTURE_SUCCESS "$RUNNER_TEMP/idrem-check/capture.log"
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-test-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/idrem-check/*.log
            ${{ runner.temp }}/idrem-android/export.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Android prototype
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idrem-zenkai-android-${{ github.run_number }}
          path: game/artifacts/
          if-no-files-found: error
          retention-days: 7
