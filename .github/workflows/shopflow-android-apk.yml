name: ShopFlow Android APK

on:
  push:
    branches:
      - arena/0b9f89cc-matchly-project
    paths:
      - 'shopflow/**'
      - '.github/workflows/shopflow-android-apk.yml'
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: Publish or refresh the public Android test APK release asset
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopflow/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        working-directory: shopflow
        run: npm ci

      - name: Build ShopFlow web application
        working-directory: shopflow
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: shopflow
        run: npx cap sync android

      - name: Assemble APK
        working-directory: shopflow/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopFlow-Android-debug-APK
          path: shopflow/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Android test download
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_test_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/ShopFlow-Android.apk"
          cp shopflow/android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          tag="shopflow-android-test-v0.1.0"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ShopFlow Android — test 0.1.0" \
              --notes "Version Android de test ShopFlow. APK de débogage destiné aux essais, pas à une distribution commerciale. Android peut demander l’autorisation d’installer des applications provenant de cette source." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
