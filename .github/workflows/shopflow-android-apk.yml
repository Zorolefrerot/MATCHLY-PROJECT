name: ShopFlow test installers

on:
  push:
    branches:
      - arena/cd1aec74-matchly-project
    paths:
      - 'shopflow/**'
      - 'desktop/**'
      - '.github/workflows/shopflow-android-apk.yml'
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: Publish the verified Android APK and Windows installer to the public test release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: shopflow-test-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build and verify Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopflow/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Restore stable test signing key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ShopFlow-Test-Debug.keystore"
          if gh release view shopflow-android-test-v0.1.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fqx 'ShopFlow-Test-Debug.keystore'; then
            gh release download shopflow-android-test-v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern ShopFlow-Test-Debug.keystore --dir "$RUNNER_TEMP"
          else
            keytool -genkeypair -noprompt \
              -keystore "$key" \
              -storetype JKS \
              -storepass shopflow-test-only \
              -keypass shopflow-test-only \
              -alias shopflow-test \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ShopFlow Test, O=ShopFlow, C=CD"
          fi
          cp "$key" shopflow/android/app/shopflow-test-debug.keystore

      - name: Install web dependencies
        working-directory: shopflow
        run: npm ci

      - name: Build ShopFlow web application
        working-directory: shopflow
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: shopflow
        run: npx cap sync android

      - name: Assemble APK
        working-directory: shopflow/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK package, version, and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=shopflow/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/shopflow-badging.txt"
          grep -q "package: name='cd.shopflow.app.test'" "$RUNNER_TEMP/shopflow-badging.txt"
          grep -q "versionName='1.0.3-test'" "$RUNNER_TEMP/shopflow-badging.txt"

      - name: Upload verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopFlow-Android-APK
          path: shopflow/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop packaging dependencies
        run: npm ci --prefix desktop

      - name: Package Windows installer
        run: npm --prefix desktop run build:windows

      - name: Verify and launch-test Windows installer
        shell: pwsh
        run: |
          $installer = Get-Item "desktop/release/ShopFlow-Windows.exe"
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
          $installDir = Join-Path $env:RUNNER_TEMP "ShopFlow-smoke-install"
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Silent installer failed with exit code $($setup.ExitCode)" }
          $appPath = Join-Path $installDir "ShopFlow.exe"
          if (-not (Test-Path $appPath)) { throw "Installed application was not found at $appPath" }
          Get-Process -Name ShopFlow -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $app = Start-Process -FilePath $appPath -ArgumentList '--disable-gpu' -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "ShopFlow exited during the startup smoke test with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ShopFlow-Windows-Installer
          path: desktop/release/ShopFlow-Windows.exe
          if-no-files-found: error
          retention-days: 30

  publish-test-release:
    name: Publish verified installers
    needs: [android, windows]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_test_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-shopflow-test-release]')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ShopFlow-Android-APK
          path: release-assets

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ShopFlow-Windows-Installer
          path: release-assets

      - name: Publish versioned public test release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: shopflow-test-v1.0.3
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/ShopFlow-Android.apk"
          exe="$RUNNER_TEMP/ShopFlow-Windows.exe"
          cp release-assets/app-debug.apk "$apk"
          cp release-assets/ShopFlow-Windows.exe "$exe"
          title="ShopFlow 1.0.3 — test Android et Windows"
          notes="Builds de test ShopFlow 1.0.3. Android : APK debug signé, package cd.shopflow.app.test, installable à côté d'une version de production. Windows : installateur x64 non signé; Windows SmartScreen peut afficher un avertissement. Le premier lancement Windows nécessite Internet; l'application utilise une session persistante pour conserver ses données locales. Aucun fichier n'est une version de boutique d'applications."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" "$exe" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$RELEASE_TAG" "$apk" "$exe" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
