name: ShopFlow Android APK

on:
  push:
    branches:
      - arena/0b9f89cc-matchly-project
    paths:
      - 'shopflow/**'
      - '.github/workflows/shopflow-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopflow/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        working-directory: shopflow
        run: npm ci

      - name: Build ShopFlow web application
        working-directory: shopflow
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: shopflow
        run: npx cap sync android

      - name: Assemble APK
        working-directory: shopflow/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopFlow-Android-debug-APK
          path: shopflow/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
