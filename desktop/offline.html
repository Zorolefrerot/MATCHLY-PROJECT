<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ShopFlow — Connexion indisponible</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f7f9fc; color: #17233d; font: 15px/1.6 "Segoe UI", Arial, sans-serif; }
      main { width: min(470px, calc(100% - 36px)); padding: 30px; border: 1px solid #e4e9f1; border-radius: 20px; background: white; box-shadow: 0 20px 55px rgba(30, 53, 96, .09); }
      .label { margin: 0 0 8px; color: #2456d8; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
      p { margin: 11px 0 20px; color: #65728a; font-size: 13px; }
      button { width: 100%; min-height: 46px; border: 0; border-radius: 11px; color: white; background: #2456d8; font: inherit; font-weight: 800; cursor: pointer; }
      button:hover { background: #1747c5; }
      .help { display: block; margin-top: 13px; color: #8994a6; text-align: center; font-size: 11px; }
    </style>
  </head>
  <body><main><p class="label">ShopFlow pour Windows</p><h1>Connexion indisponible</h1><p>Vérifiez votre connexion Internet puis réessayez. Vos données enregistrées localement ne sont pas effacées par cet écran.</p><button type="button" onclick="location.href='https://shopflow-drc.onrender.com/app/'">Réessayer</button><small class="help">La première ouverture nécessite Internet.</small></main></body>
</html>
