<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ShopFlow — Chargement</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f7f9fc; color: #17233d; font: 15px/1.6 "Segoe UI", Arial, sans-serif; }
      main { width: min(420px, calc(100% - 40px)); padding: 34px; border: 1px solid #e4e9f1; border-radius: 20px; background: white; text-align: center; box-shadow: 0 20px 55px rgba(30, 53, 96, .09); }
      .mark { display: grid; width: 52px; height: 52px; margin: 0 auto 18px; place-items: center; border-radius: 16px; color: white; background: #2456d8; font-size: 23px; font-weight: 800; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
      p { margin: 9px 0 21px; color: #65728a; font-size: 13px; }
      .spinner { width: 24px; height: 24px; margin: auto; border: 3px solid #dce5f8; border-top-color: #2456d8; border-radius: 50%; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body><main><div class="mark" aria-hidden="true">S</div><h1>ShopFlow</h1><p>Connexion sécurisée à votre espace. Au premier lancement, une connexion Internet est nécessaire.</p><div class="spinner" role="status" aria-label="Chargement"></div></main></body>
</html>
